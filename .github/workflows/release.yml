name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: skillmatch-release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Update release PR or publish its merged release
        uses: googleapis/release-please-action@v4.4.1
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
