name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: skillmatch-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/development' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Use a Conventional Commit title, such as fix(cv): preserve committed uploads." >&2
            exit 1
          fi

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: skillmatch_test
          POSTGRES_USER: skillmatch_test
          POSTGRES_PASSWORD: skillmatch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U skillmatch_test -d skillmatch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://skillmatch_test:skillmatch_ci@127.0.0.1:5432/skillmatch_test
      ENVIRONMENT: test
      EMAIL_PROVIDER: fake
      EMBEDDINGS_ENABLED: "false"
      SKILL_NER_ENABLED: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test tools
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -c "import app; print('app import OK')"

      - name: Apply test database migrations
        working-directory: backend
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U skillmatch_test -d skillmatch_test < ../docker/postgres/test-init.sql
          export SKILLMATCH_UPLOAD_TEST_DATABASE_URL="$DATABASE_URL"
          python ../tests/backend_test_database.py
          alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: |
          export SKILLMATCH_UPLOAD_TEST_DATABASE_URL="$DATABASE_URL"
          python -m pytest -q tests ../tests

      - name: Run Ruff
        working-directory: backend
        run: ruff check app tests ../tests

      - name: Check Python dependencies
        run: python -m pip check

      - name: Check Alembic alignment
        working-directory: backend
        run: alembic check

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  monitor-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run email monitor tests
        run: python -B -m unittest discover -s ops -p test_email_monitor.py

      - name: Check release test dependencies and run regressions
        shell: bash
        run: |
          for tool in bash flock jq; do
            if ! command -v "$tool" >/dev/null; then
              echo "Required release test dependency missing: $tool" >&2
              exit 1
            fi
          done
          python -B -m unittest discover -s ops -p 'test_*release.py' -v
