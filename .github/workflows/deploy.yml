name: Deploy a production release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published Release Please tag (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: skillmatch-production
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Require an enabled release deployment from main
        env:
          PRODUCTION_RELEASES_ENABLED: ${{ vars.PRODUCTION_RELEASES_ENABLED }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ||
                "$PRODUCTION_RELEASES_ENABLED" != true ]]; then
            echo "Production release deployment is disabled or was requested outside main." >&2
            exit 1
          fi

      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the published release and its merged PR
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PLEASE_APP_BOT: ${{ vars.RELEASE_PLEASE_APP_BOT }}
        run: bash scripts/verify-release.sh

  quality-checks:
    needs: validate-release
    cache-mode: none
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.validate-release.outputs.sha }}

  build-and-push:
    needs: [validate-release, quality-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    cache-mode: none
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate-release.outputs.sha }}

      - name: Prepare image metadata
        shell: bash
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${RELEASE_TAG}-${RELEASE_SHA}-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/skillmatch-ai-backend:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/skillmatch-ai-frontend:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}

  deploy:
    needs: [validate-release, build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
      DEPLOY_SHA: ${{ needs.validate-release.outputs.sha }}
      BACKEND_DIGEST: ${{ needs.build-and-push.outputs.backend_digest }}
      FRONTEND_DIGEST: ${{ needs.build-and-push.outputs.frontend_digest }}
      GITHUB_ACTOR_NAME: ${{ github.actor }}
    steps:
      - name: Validate production configuration and image digests
        env:
          PRODUCTION_ENV_READY: ${{ vars.PRODUCTION_ENV_READY }}
        shell: bash
        run: |
          test "$PRODUCTION_ENV_READY" = true
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Prepare image owner
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR on VPS with ephemeral credentials
        id: ghcr-login
        shell: bash
        run: |
          AUTH_DIR="/dev/shm/skillmatch-ghcr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "umask 077 && mkdir -- '$AUTH_DIR'"
          printf '%s' "$GHCR_TOKEN" | \
            ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" \
              "docker --config '$AUTH_DIR' login ghcr.io --username '$GITHUB_ACTOR_NAME' --password-stdin"

      - name: Deploy immutable images
        shell: bash
        run: |
          AUTH_DIR="/dev/shm/skillmatch-ghcr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" bash -s -- "$RELEASE_TAG" "$DEPLOY_SHA" "$OWNER_LC" "$AUTH_DIR" "$BACKEND_DIGEST" "$FRONTEND_DIGEST" <<'REMOTE'
          set -Eeuo pipefail
          cd /srv/apps/skillmatch-ai
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main "refs/tags/$1:refs/tags/$1"
          test "$(git rev-parse "refs/tags/$1^{commit}")" = "$2"
          git merge-base --is-ancestor "$2" refs/remotes/origin/main
          git show "$2:scripts/deploy-release.sh" | bash -s -- "$@"
          REMOTE

      - name: Remove ephemeral GHCR credentials
        if: always() && steps.ghcr-login.outcome != 'skipped'
        shell: bash
        run: |
          AUTH_DIR="/dev/shm/skillmatch-ghcr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "docker --config '$AUTH_DIR' logout ghcr.io >/dev/null 2>&1 || true; rm -rf '$AUTH_DIR'" \
            || true
